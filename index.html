<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Para Beako</title>
    <script src="https://pygame-web.github.io/archives/0.8/pygbag.js"></script>
</head>
<body style="margin:0;padding:0;background-color:black;">
    <div id="game_container"></div>
    <script>
        window.addEventListener('load', async () => {
            // Esto carga el motor directamente desde los servidores de Pygbag
            // para que tú no tengas que subir los archivos .bin o .apk
            const options = {
                高度: 500,
                宽度: 900,
            }
            await window.pygbag.start("game_container", "main.py");
        });
    </script>
</body>
</html>
